services:
  postgres:
    image: postgres:16-alpine
    container_name: jogodavelha-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jogodavelha-network

  redis:
    image: redis:7-alpine
    container_name: jogodavelha-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jogodavelha-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jogodavelha-api
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://jogodavelha-frontend.vercel.app,https://jogodavelha-frontend-dev.vercel.app,https://*.vercel.app}
      GAME_STATE_TTL: ${GAME_STATE_TTL}
      GAME_STATE_UPDATE_MAX_RETRIES: ${GAME_STATE_UPDATE_MAX_RETRIES}
      GAME_PRESENCE_TTL: ${GAME_PRESENCE_TTL:-300000}
      GAME_PRESENCE_REFRESH_INTERVAL: ${GAME_PRESENCE_REFRESH_INTERVAL:-30000}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jogodavelha-network

volumes:
  postgres-data:

networks:
  jogodavelha-network:
    driver: bridge
