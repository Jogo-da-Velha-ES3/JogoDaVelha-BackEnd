spring:
  application:
    name: jogodavelha-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

game:
  state:
    ttl: ${GAME_STATE_TTL:1800000}
    update:
      max-retries: ${GAME_STATE_UPDATE_MAX_RETRIES:5}

payments:
  simulated:
    enabled: true